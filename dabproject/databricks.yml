# This is a Declarative Automation Bundle definition for dabproject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproject
  uuid: 42acac57-e8c9-435c-82e0-9521501c4e50

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog_name:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment : false
    workspace:
      host: https://dbc-ae95ec21-4394.cloud.databricks.com/
    variables:
      catalog_name: ecommerse
      schema: bronze
  prod:
    mode: production
    workspace:
      host: https://dbc-ae95ec21-4394.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/khakoleharshal@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/khakoleharshal@gmail.com/PROD.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name: ecommerse
      schema: prod
    permissions:
      - user_name: khakoleharshal@gmail.com
        level: CAN_MANAGE
