# A sample job for dabproject.

resources:
  jobs:
    sample_job:
      name: sample_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog_name}
        - name: schema
          default: bronze

      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - --editable ${workspace.file_path}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../src/sample_notebook.ipynb
        - task_key: python_wheel_task
          depends_on:
            - task_key: notebook_task
          python_wheel_task:
            package_name: dabproject
            entry_point: main
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--schema"
              - "bronze"
          environment_key: default
        - task_key: refresh_pipeline
          depends_on:
            - task_key: notebook_task
          pipeline_task:
            pipeline_id: ${resources.pipelines.dabproject_etl.id}
